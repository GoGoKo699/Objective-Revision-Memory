name: Verify research certificates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-09-22
        with:
          persist-credentials: false
      - name: Run standard-library checks
        run: python3 checks/run_all.py --include-conjunction
